<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CeraVe Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0055a5; --accent: #e67e22; --bg: #f4f7f9; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        /* Login Section */
        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: #2c3e50; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; width: 300px; }
        
        /* Main Layout */
        header { background: var(--primary); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn { padding: 12px 25px; border: none; background: #ddd; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .tab-btn.active { background: var(--accent); color: white; }

        /* Sections */
        .section { display: none; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

        /* Form Controls */
        .form-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        input, textarea { padding: 12px; border: 1px solid #eee; border-radius: 8px; font-family: 'Kanit'; font-size: 1rem; }
        .full-width { grid-column: span 2; }
        .submit-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #666; }
        .badge { padding: 5px 10px; border-radius: 5px; font-size: 0.85rem; font-weight: 600; }
        .bg-wait { background: #fff3e0; color: #ef6c00; }
        .bg-done { background: #e8f5e9; color: #2e7d32; }
        .action-btn { padding: 5px 12px; border-radius: 5px; border: none; cursor: pointer; font-size: 0.8rem; margin-right: 5px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2 style="margin-bottom: 20px;">🔒 Admin Access</h2>
            <input type="password" id="admin-password" placeholder="ใส่รหัสผ่าน (1234)" style="width: 80%; margin-bottom: 20px;">
            <button class="submit-btn" onclick="checkAuth()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <div id="admin-panel" style="display: none;">
        <header>
            <h1>CeraVe Store Management</h1>
            <p>ระบบจัดการหลังบ้านระดับพรีเมียม</p>
        </header>

        <div class="container">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('inventory', this)">📦 คลังสินค้า</button>
                <button class="tab-btn" onclick="switchTab('orders', this)">🧾 ออเดอร์ลูกค้า (<span id="count-badge">0</span>)</button>
                <button class="tab-btn" onclick="location.reload()" style="margin-left:auto; background:#eee;">ออกจากระบบ</button>
            </div>

            <div id="inventory" class="section active">
                <h3>+ เพิ่มสินค้าใหม่เข้าระบบ</h3>
                <div class="form-group">
                    <input type="text" id="p-name" placeholder="ชื่อสินค้า">
                    <input type="number" id="p-price" placeholder="ราคา (บาท)">
                    <input type="number" id="p-stock" placeholder="จำนวนสต็อก">
                    <input type="text" id="p-img" placeholder="ลิงก์รูปภาพ (URL)">
                    <textarea id="p-desc" class="full-width" placeholder="รายละเอียด/คุณสมบัติสินค้า"></textarea>
                    <button class="submit-btn full-width" onclick="saveNewProduct()" style="background: #2ecc71;">ยืนยันเพิ่มสินค้า</button>
                </div>

                <hr style="border: 0.5px solid #eee;">
                <h3>รายการสินค้าปัจจุบัน</h3>
                <table id="product-table">
                    <thead><tr><th>รูป</th><th>ชื่อสินค้า</th><th>สต็อก</th><th>ราคา</th><th>จัดการ</th></tr></thead>
                    <tbody id="product-list"></tbody>
                </table>
            </div>

            <div id="orders" class="section">
                <h3>รายการออเดอร์ล่าสุด</h3>
                <table>
                    <thead><tr><th>ว/ด/ป</th><th>ลูกค้า/เบอร์โทร</th><th>สินค้าที่สั่ง</th><th>ยอดสุทธิ</th><th>สถานะ</th><th>การจัดการ</th></tr></thead>
                    <tbody id="order-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลหลัก
        let products = JSON.parse(localStorage.getItem('my_stock')) || [];
        let orders = JSON.parse(localStorage.getItem('my_orders')) || [];

        function checkAuth() {
            if(document.getElementById('admin-password').value === '1234') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                renderUI();
            } else { alert("รหัสผ่านไม่ถูกต้อง!"); }
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function saveNewProduct() {
            const name = document.getElementById('p-name').value;
            const price = Number(document.getElementById('p-price').value);
            const qty = Number(document.getElementById('p-stock').value);
            const img = document.getElementById('p-img').value;
            const desc = document.getElementById('p-desc').value;

            if(name && price) {
                products.push({ id: Date.now(), name, price, qty, img, desc });
                syncData();
                document.querySelectorAll('input, textarea').forEach(el => el.value = "");
                alert("เพิ่มสินค้าเรียบร้อย!");
            }
        }

        function deleteProduct(id) {
            if(confirm("ต้องการลบสินค้านี้ใช่หรือไม่?")) {
                products = products.filter(p => p.id !== id);
                syncData();
            }
        }

        function markAsShipped(id) {
            orders.find(o => o.id === id).status = "จัดส่งเรียบร้อย";
            syncData();
        }

        function syncData() {
            localStorage.setItem('my_stock', JSON.stringify(products));
            localStorage.setItem('my_orders', JSON.stringify(orders));
            renderUI();
        }

        function renderUI() {
            // Render Stock
            document.getElementById('product-list').innerHTML = products.map(p => `
                <tr>
                    <td><img src="${p.img}" width="40" style="border-radius:5px;"></td>
                    <td>${p.name}</td>
                    <td><b>${p.qty || p.stock || 0}</b></td>
                    <td>${p.price}.-</td>
                    <td><button class="action-btn" style="background:#ff7675; color:white;" onclick="deleteProduct(${p.id})">ลบ</button></td>
                </tr>
            `).join('');

            // Render Orders
            const waitingOrders = orders.filter(o => o.status === 'รอจัดส่ง');
            document.getElementById('count-badge').innerText = waitingOrders.length;
            
            document.getElementById('order-list').innerHTML = orders.map(o => `
                <tr>
                    <td><small>${o.time}</small></td>
                    <td>${o.user}<br><small>${o.tel}</small></td>
                    <td><small>${o.items}</small></td>
                    <td><b>${o.total}.-</b></td>
                    <td><span class="badge ${o.status === 'รอจัดส่ง' ? 'bg-wait' : 'bg-done'}">${o.status}</span></td>
                    <td>
                        ${o.status === 'รอจัดส่ง' ? `<button class="action-btn" style="background:var(--primary); color:white;" onclick="markAsShipped(${o.id})">ส่งแล้ว</button>` : '✅'}
                    </td>
                </tr>
            `).reverse().join('');
        }
    </script>
</body>
</html>
